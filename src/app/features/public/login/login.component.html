<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="icon-container">
        <i class="bi bi-hospital icon"></i>
      </div>
      <p class="welcome-text">Bienvenue sur</p>
      <h1 class="system-title">Système de Gestion de Rendez-vous<br>Médicaux</h1>
    </div>

    <div class="login-form">
      <h2 class="form-title">Se connecter</h2>
      
      <form>
        <div class="form-group">
          <label for="login">Login</label>
          <input 
            type="text" 
            id="login" 
            class="form-control" 
            placeholder="Email ou nom d'utilisateur"
          />
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Mot de passe"
          />
        </div>

        <div class="forgot-password">
          <a href="#" class="link">Mot de passe oublié?</a>
        </div>

        <button type="submit" class="btn-connect">Se connecter</button>

        <div class="signup-link">
          Pas encore inscrit? <a href="#" class="link">S'inscrire</a>
        </div>
      </form>
    </div>
  </div>
</div>
